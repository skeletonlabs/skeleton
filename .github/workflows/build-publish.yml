name: Publish Skeleton

on:
    push:
        branches:
            - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
    release:
        permissions:
            contents: write
            pull-requests: write
            id-token: write
        name: Build & Publish
        if: github.repository == 'skeletonlabs/skeleton'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 26
                  cache: pnpm
            - run: npm install -g npm@latest
            - name: Install dependencies
              run: pnpm install
            - name: Publish unpublished packages
              run: pnpm publish -r --access public --no-git-checks
            - name: Create Release Pull Request
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  if ! ls .changeset/*.md >/dev/null 2>&1; then
                    echo "No pending change intents."
                    exit 0
                  fi
                  pnpm version -r
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git checkout -B changeset-release/main
                  git add -A
                  git commit -m "task: release"
                  git push --force origin changeset-release/main
                  if [ -z "$(gh pr list --head changeset-release/main --json number --jq '.[0].number')" ]; then
                    gh pr create --base main --head changeset-release/main --title "task: release" --body "Versions packages and updates changelogs."
                  fi
